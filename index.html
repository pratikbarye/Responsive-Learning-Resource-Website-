            <div class="carousel-item active">
              <img
                src="https://images.pexels.com/photos/30227319/pexels-photo-30227319/free-photo-of-serene-view-of-mount-fuji-at-dusk.jpeg?auto=compress&cs=tinysrgb&w=600&lazy=load"

                alt="..."
              />
            </div>
          </div>
          <button
            class="carousel-control-prev"
            type="button"
            data-bs-target="#carouselExample"
            data-bs-slide="prev"
          >

            <span class="visually-hidden">Previous</span>
          </button>
          <button

            data-bs-slide="next"
          >

          </button>
